[project]
name = "patchgoblin"
version = "0.1.0"
description = "Queue AI planning and implementation tasks on local and SSH projects."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1,<4",
    "pillow>=10",
    "pystray>=0.19,<1",
    "pywinpty>=2.0 ; sys_platform == 'win32'",
    "waitress>=3.0,<4",
]

[tool.uv]
# An app run from this directory (python run.py), not an installable package.
package = false

[tool.ruff]
line-length = 140

[tool.ruff.lint]
ignore = [
    "TRY004",  # validators raise ValueError on purpose: routes map it to HTTP 400
    "BLE001",  # deliberate catch-alls so a plugin/session/background error never fails the request
    "S110",    # best-effort cleanup where a failure is expected and harmless
    "RUF012",  # class-level plugin declarations and test fixtures are never mutated
]
