{# Terminals sidebar: open sessions by group, then a picker to start a new one. #}
<div id="sidebar-terminals">
  <ul id="term-list" class="project-list"></ul>
  <div class="term-new">
    <select id="term-new-project" aria-label="Project for a new terminal"></select>
    <button type="button" class="small" id="term-new-btn">+ New</button>
  </div>
  <p class="muted small term-hint">Ctrl+Shift: D split right, E split down, W close, arrows move focus, Z zoom, T new group, PageUp/PageDown switch group. Ctrl +/−/0 sets the font size.</p>
</div>
