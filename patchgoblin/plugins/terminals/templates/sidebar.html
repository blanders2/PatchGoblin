{# Terminals sidebar: open sessions, then a picker to start a new one. #}
<div id="sidebar-terminals">
  <ul id="term-list" class="project-list"></ul>
  <div class="term-new">
    <select id="term-new-project" aria-label="Project for a new terminal"></select>
    <button type="button" class="small" id="term-new-btn">+ New</button>
  </div>
</div>
