{# Terminals main view: a toolbar (group tabs, split and font buttons), then the tiled panes filling the rest. #}
<div id="term-view">
  <div class="term-bar" id="term-bar">
    <div class="term-groups" id="term-groups" role="tablist" aria-label="Terminal groups"></div>
    <span class="term-tools">
      <button type="button" class="ghost small" id="term-split-right" title="Split right (Ctrl+Shift+D)">Split right</button>
      <button type="button" class="ghost small" id="term-split-down" title="Split down (Ctrl+Shift+E)">Split down</button>
      <button type="button" class="ghost small" id="term-font-minus" title="Smaller text (Ctrl+-)" aria-label="Smaller text">A−</button>
      <button type="button" class="ghost small" id="term-font-plus" title="Larger text (Ctrl+=)" aria-label="Larger text">A+</button>
    </span>
  </div>
  <div id="term-stage" class="term-stage"></div>
  <div id="term-dock" class="term-dock" hidden aria-label="Minimized terminals"></div>
  <div id="term-parking" hidden></div>
  <div id="term-empty" class="term-empty muted">
    <p>Open a terminal for a project with <b>+ New</b> in the sidebar, or with a project's <b>Terminal</b> button once Settings → Terminal opens terminals in the browser.</p>
  </div>
</div>
